<!DOCTYPE html>
<html>
  <head>
    <title>Stock Widget</title>
    <script src="popup.bundle.js"></script>
    <style>
      body {
        width: 300px;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
      }
      
      .header {
        background-color: #e74c3c;
        color: white;
        padding: 15px;
        text-align: center;
      }
      
      h1 {
        margin: 0;
        font-size: 20px;
      }
      
      .content {
        padding: 15px;
      }
      
      .control-group {
        margin-bottom: 15px;
      }
      
      label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
      }
      
      .toggle-switch {
        position: relative;
        display: inline-block;
        width: 50px;
        height: 24px;
      }
      
      .toggle-switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      
      .slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #ccc;
        transition: .4s;
        border-radius: 24px;
      }
      
      .slider:before {
        position: absolute;
        content: "";
        height: 16px;
        width: 16px;
        left: 4px;
        bottom: 4px;
        background-color: white;
        transition: .4s;
        border-radius: 50%;
      }
      
      input:checked + .slider {
        background-color: #2ecc71;
      }
      
      input:checked + .slider:before {
        transform: translateX(26px);
      }
      
      .add-stock {
        display: flex;
        margin-top: 15px;
      }
      
      .add-stock input {
        flex-grow: 1;
        padding: 8px;
        border: 1px solid #ddd;
        border-radius: 4px 0 0 4px;
      }
      
      .add-stock button {
        background-color: #e74c3c;
        color: white;
        border: none;
        padding: 8px 15px;
        border-radius: 0 4px 4px 0;
        cursor: pointer;
      }
      
      .footer {
        padding: 10px 15px;
        background-color: #f5f5f5;
        font-size: 12px;
        color: #777;
        text-align: center;
        border-top: 1px solid #ddd;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>Stock Widget Controls</h1>
    </div>
    
    <div class="content">
      <div class="control-group">
        <label for="widget-toggle">Show Widget</label>
        <label class="toggle-switch">
          <input type="checkbox" id="widget-toggle" checked>
          <span class="slider"></span>
        </label>
      </div>
      
      <div class="control-group">
        <label for="update-interval">Update Interval</label>
        <select id="update-interval" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
          <option value="5000">5 seconds</option>
          <option value="10000" selected>10 seconds</option>
          <option value="30000">30 seconds</option>
          <option value="60000">1 minute</option>
        </select>
      </div>
      
      <div class="add-stock">
        <input type="text" id="stock-symbol" placeholder="Add stock symbol...">
        <button id="add-stock-btn">Add</button>
      </div>
    </div>
    
    <div class="footer">
      Stock Widget Extension v1.0
    </div>
  </body>
</html>
